name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Second opinions for the PNG encoder's tests (skipped when missing).
      - name: Install ImageMagick and Pillow
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick python3-pil
      - run: npm test
