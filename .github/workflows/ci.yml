name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Second opinions for the PNG and GIF tests (skipped when missing).
      - name: Install ImageMagick, Pillow and ffmpeg
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick python3-pil ffmpeg
      - run: npm test

  # The toolbox reads and writes files: check it where paths and line endings
  # differ.
  toolbox:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/png.test.mjs test/gif.test.mjs test/toolbox.test.mjs

  # TexturePacker JSON atlases loaded in real Phaser 3, Phaser 4 and PixiJS 8
  # (dev dependencies) in headless Chromium.
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: node --test test/engines.test.mjs
        env:
          LUDO_REQUIRE_ENGINES: "1"
