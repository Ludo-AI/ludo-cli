name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # Second opinions for the PNG, GIF, WebP and MP3 tests (skipped when
      # missing, except libwebp's tools and Pillow for WebP and ffmpeg and LAME
      # for MP3, required here).
      - name: Install ImageMagick, Pillow, ffmpeg, libwebp's tools and LAME
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick python3-pil ffmpeg webp lame
      - run: npm test
        env:
          LUDO_REQUIRE_WEBP_TOOLS: "1"
          LUDO_REQUIRE_MP3_TOOLS: "1"

  # The toolbox reads and writes files: check it where paths and line endings
  # differ.
  toolbox:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --test test/png.test.mjs test/gif.test.mjs test/webp.test.mjs test/pack.test.mjs test/sequence.test.mjs test/align.test.mjs test/web-math/exportPackMath.test.mjs test/web-math/exportSequenceMath.test.mjs test/toolbox.test.mjs test/unity.test.mjs test/tiles.test.mjs test/model.test.mjs test/video.test.mjs test/audio.test.mjs test/mp3.test.mjs test/preview.test.mjs test/sprite-analysis.test.mjs test/asset.test.mjs test/audio-analysis.test.mjs test/model-analysis.test.mjs test/image-analysis.test.mjs

  # TexturePacker JSON atlases loaded in real Phaser 3, Phaser 4 and PixiJS 8
  # (dev dependencies) in headless Chromium.
  engines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run build
      - run: node --test test/engines.test.mjs
        env:
          LUDO_REQUIRE_ENGINES: "1"
